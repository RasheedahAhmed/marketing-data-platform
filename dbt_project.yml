{
  "name": "marketing_data_platform",
  "version": "1.0.0",
  "config-version": 2,
  "profile": "marketing_data_platform",
  "require-dbt-version": [
    ">=1.10.8",
    "<1.11.0"
  ],
  "model-paths": [
    "models"
  ],
  "test-paths": [
    "tests"
  ],
  "macro-paths": [
    "macros"
  ],
  "clean-targets": [
    "target",
    "dbt_packages"
  ],
  "vars": {
    "strict_relationships": true
  },
  "models": {
    "marketing_data_platform": {
      "+persist_docs": {
        "relation": true,
        "columns": true
      },
      "staging": {
        "+materialized": "view",
        "+schema": "staging"
      },
      "intermediate": {
        "+materialized": "ephemeral"
      },
      "marts": {
        "+schema": "marts"
      }
    },
    "elementary": {
      "+schema": "elementary"
    }
  },
  "data_tests": {
    "+store_failures": true
  }
}
