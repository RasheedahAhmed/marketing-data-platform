{
  "marketing_data_platform": {
    "target": "dev",
    "outputs": {
      "dev": {
        "type": "databricks",
        "host": "{{ env_var('DBT_HOST', 'configure-workspace-host') }}",
        "http_path": "{{ env_var('DBT_HTTP_PATH', '/sql/1.0/warehouses/configure') }}",
        "catalog": "{{ env_var('DBT_CATALOG', 'marketing_dev') }}",
        "schema": "{{ env_var('DBT_SCHEMA', 'dev_rasheedah') }}",
        "auth_type": "oauth",
        "threads": 4
      },
      "staging": {
        "type": "databricks",
