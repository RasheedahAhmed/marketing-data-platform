        "schema": "{{ env_var('DBT_SCHEMA', 'marketing') }}",
        "auth_type": "oauth",
        "threads": 4,
        "client_id": "{{ env_var('DATABRICKS_CLIENT_ID', '') }}",
        "client_secret": "{{ env_var('DBT_ENV_SECRET_DATABRICKS_CLIENT_SECRET', '') }}"
      },
