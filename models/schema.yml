{
  "version": 2,
  "models": [
    {
      "name": "stg_facebook_stats",
      "description": "Typed daily facebook metrics. Exact duplicate raw rows collapse; conflicting rows at the business grain fail tests. Null impressions/clicks remain unknown.",
      "columns": [
        {
          "name": "ad_id",
          "description": "Source ad identifier, always string."
        },
        {
          "name": "date_day",
          "description": "Source reporting date; no inferred timezone conversion."
        },
        {
          "name": "spend",
          "description": "Source monetary amount in currency_code, six decimal places. Snapchat input is already decimal; no micro-unit division."
        },
        {
          "name": "impressions",
          "description": "Nullable count; null means unknown, not zero."
        },
        {
          "name": "clicks",
          "description": "Nullable source clicks; platform definitions can differ."
        },
        {
          "name": "_batch_id",
          "description": "Identifier of the complete published input snapshot."
        }
      ]
    },
    {
      "name": "stg_snapchat_stats",
      "description": "Typed daily snapchat metrics. Exact duplicate raw rows collapse; conflicting rows at the business grain fail tests. Null impressions/clicks remain unknown.",
